name: CI

# push だけだと PR の時点で落ちていることに気づけないので、両方で動かす。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # ⚠️ package.json の check を呼ぶこと。ここに検査を 1 つずつ書き写すと、
      #    check に足した検査が CI から漏れる。実際にそうなっていた:
      #    このワークフローは build-sw --check だけを走らせていて、
      #    npm run check のもう半分（正本ゲート scripts/check-standard.mjs の
      #    共通検査 38 件）は一度も動いていなかった。
      #    check = node scripts/check-standard.mjs && node tools/build-sw.mjs --check
      - name: 品質ゲート（正本の共通検査 ＋ SW の版が中身と一致しているか）
        run: npm run check

  # 正本（GIGAyama.github.io/standards/）との一致。コピーだけ直すと他リポジトリに修正が届かないため。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
